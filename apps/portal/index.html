<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <!--
      Strict policy for the built application. The development server swaps it for a
      looser one (see vite.config.ts) because Vite's hot reload needs inline script and style.
      frame-ancestors, HSTS and the other response headers cannot be set from a meta element;
      the production reverse proxy must send them (see README.md).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; worker-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="same-origin" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>TINNOX CMS</title>
  </head>
  <body>
    <noscript>TINNOX CMS needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
