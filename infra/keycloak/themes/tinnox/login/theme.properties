# TINNOX login theme for the local development Keycloak realm.
# It keeps every template of Keycloak's own keycloak.v2 theme (so element ids such as
# #username, #password, #otp and #kc-login stay as they are) and only adds one stylesheet
# that restyles the pages to match the portal (docs/portal-v2/design-system.md, DEC-34).
# Development only: production uses a separately reviewed identity provider.
parent=keycloak.v2
import=common/keycloak

# css/styles.css is inherited from keycloak.v2; css/tinnox.css is loaded after it.
styles=css/styles.css css/tinnox.css
