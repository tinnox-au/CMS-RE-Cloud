# Local development services for TINNOX CMS prototype M0.
# Start with:  npm run infra:up   (docker compose --env-file .env -f infra/docker-compose.yml up -d --wait postgres keycloak)
# Everything binds to 127.0.0.1 only. Values come from the gitignored .env written by scripts/setup-dev.mjs.
name: tinnox-cms

services:
  postgres:
    # Tag and digest of the multi-arch index pulled on 2026-11-14 (PostgreSQL 17.12, Alpine 3.24).
    image: postgres:17.12-alpine3.24@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?run npm run setup first}
      TINNOX_MIGRATOR_PASSWORD: ${TINNOX_MIGRATOR_PASSWORD:?run npm run setup first}
      TINNOX_APP_PASSWORD: ${TINNOX_APP_PASSWORD:?run npm run setup first}
      TZ: UTC
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-54329}:5432'
    volumes:
      - tinnox_pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP on purpose: during first-run initialisation the server listens on the socket only,
      # so this cannot report healthy before the roles and databases exist.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432 -U tinnox_app -d tinnox']
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  keycloak:
    # Development identity provider only. Production uses a separately reviewed provider (see docs).
    image: quay.io/keycloak/keycloak:26.8.2@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
    restart: unless-stopped
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?run npm run setup first}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?run npm run setup first}
      KC_HEALTH_ENABLED: 'true'
      KC_HTTP_PORT: '8080'
      KC_LOG_LEVEL: 'info'
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      # Realm import generated by scripts/setup-dev.mjs. Imported only when the realm does not exist yet;
      # the embedded dev database lives in the container, so `npm run reset -- --yes` gives a fresh import.
      - ./.generated/tinnox-dev-realm.json:/opt/keycloak/data/import/tinnox-dev-realm.json:ro
    healthcheck:
      # The image has no curl; ask the management port (9000, not published) over bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  # Media validation worker (prototype-m0.md D11). Inspects untrusted uploads.
  # It has no network, no secrets, a read-only root filesystem, a non-root user, no
  # capabilities and only the job exchange directory mounted.
  # Start with:  docker compose --env-file .env -f infra/docker-compose.yml --profile worker up -d --build media-worker
  # Start the API once first (it creates data/jobs/inbox and data/jobs/outbox with the
  # right modes); otherwise Docker creates data/jobs owned by root on Linux hosts.
  media-worker:
    profiles: ['worker']
    build:
      context: ..
      dockerfile: apps/media-worker/Dockerfile
    image: tinnox-cms-media-worker:m0
    # Restarted after a crash or after the worker exits on an inspection timeout.
    restart: unless-stopped
    network_mode: none
    read_only: true
    user: '10001:10001'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    init: true
    stop_grace_period: 5s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    environment:
      # Paths inside the container. No credentials of any kind are passed to this service.
      MEDIA_JOBS_DIR: /jobs
      NODE_ENV: production
    volumes:
      # API writes inbox/<jobId> and inbox/<jobId>.json; the worker writes outbox/<jobId>.json.
      - ../data/jobs:/jobs:rw
    healthcheck:
      # The loop touches this file every 5 s; no network is involved.
      test: ['CMD-SHELL', 'test -n "$(find /jobs/outbox/.worker-alive -mmin -1 2>/dev/null)"']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tinnox_pgdata:
